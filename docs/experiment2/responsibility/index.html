<!DOCTYPE html>
<html>
    
<head>
    <title> Psychology Experiment </title>
    
    <link rel="stylesheet" href='css/jspsych.css' />
    <link rel="stylesheet" href='css/jquery-ui-edit.css' />
    <link rel="stylesheet" href='css/jquery-ui-slider-pips-edit.css' />
   
    <script src='js/jspsych.js'></script>
    <script src='js/jquery.min.js'></script>
    <script src='js/jquery-ui.min.js'></script>
    <script src='js/jquery-ui-slider-pips.js'></script>
    <script src='js/timeme.min.js'></script>
    <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>
    <script src='js/plugin-preload.js'></script>
    <script src='js/plugin-instructions.js'></script>
    <script src='js/plugin-html-button-response.js'></script>
    <script src='js/plugin-survey-multi-choice.js'></script>
    <script src='js/plugin-survey-html-form.js'></script>

    <script src='js/plugin-resp.js'></script>
    <script src='js/feedback-demographics.js'></script>
    <script src='js/trial_info.js'></script>
    <script src='js/utils.js'></script>
    <script src='instructions/text.js'></script>
</head>

</body></body>

<script>

    TimeMe.initialize({
        currentPageName: 'page',
        idleTimeoutInSeconds: 15
    });

    // -----------------------------------------------------
    // initialize jspsych
    // -----------------------------------------------------
    var jsPsych = initJsPsych({
        show_progress_bar: true,
        auto_update_progress_bar: false,
        on_finish: () => {
            $('#jspsych-content').css('margin-top', 'auto');
            $('#jspsych-content').html('<div style="margin: auto;"> <p>' +
                ' Thank you for participating in this experiment! </p>' +
                '<p> Redirecting you back to Prolific... </p>');
            setTimeout(function(){}, 500);
            window.location = "https://app.prolific.com/submissions/complete?cc=C1GHG3J1";
        }
    });

    // -----------------------------------------------------
    // instructions and comprehension check
    // -----------------------------------------------------

    let preload_trial = {
        type: jsPsychPreload,
        images: instruction_images.concat(trial_images)
    };

    let instructions = {
        type: jsPsychInstructions,
        pages: instruction_pages,
        show_clickable_nav: true,
        on_start: function() { jsPsych.setProgressBar(0.02); },
        on_finish: function() { jsPsych.setProgressBar(0.10); }
    };

    var instructions_trial = {
        type: judgeResponsibility,
        trial: 0,
        title: 'Example',
        outcome: outcome_ex,
        on_finish: function() { jsPsych.setProgressBar(0.12); }
    }

    var instructions_last = {
        type: jsPsychHtmlButtonResponse,
        stimulus: instructions_last,
        choices: ['Continue'],
        is_narrow: true,
        on_finish: function() { jsPsych.setProgressBar(0.14); }
    }
 
    var comprehension_qs = {
        type: jsPsychSurveyMultiChoice,
        questions: [
            {
                prompt: comprehension1,
                options: options1,
                horizontal: true
            },
            {
                prompt: comprehension2,
                options: options2,
                horizontal: true
            },
            {
                prompt: comprehension3,
                options: options3,
                horizontal: true
            },
            {
                prompt: comprehension4,
                options: options4,
                horizontal: true
            },
        ],
        preamble: 'Please answer a few comprehension questions so we know' +
            ' that you understand the setup.',
        on_finish: function(data){
            data.correct = (data.response.Q0 == 'False') &&
                           (data.response.Q1 == '3 only') &&
                           (data.response.Q2 == 'True') &&
                           (data.response.Q3 == '2 only')
        }
    }
    
    var fail_comprehension = {
        timeline: [{
            type: jsPsychHtmlButtonResponse,
            stimulus: 'Unfortunately, you missed some of the comprehension ' +
                'questions.</p> <p> Please review the instructions again.',
            choices: ['Review'],
        }],
        conditional_function: function(){
            var data = jsPsych.data.get().last(1).values()[0];
            return !(data.correct);
        }
    }

    var loop_node = {
        timeline: [
            instructions,
            instructions_trial,
            instructions_last,
            comprehension_qs,
            fail_comprehension
        ],
        loop_function: function(data){
            var data = jsPsych.data.get().last(1).values()[0];
            return !(data.correct);
        }
    }
    

    // -----------------------------------------------------
    // experiment trials
    // -----------------------------------------------------

    var trials_start1 = {
        type: jsPsychHtmlButtonResponse,
        stimulus: start_prompt1,
        choices: ['Continue'],
        is_narrow: true,
        on_finish: function() { jsPsych.setProgressBar(0.2); },
    };
    
    var trials_start2 = {
        type: jsPsychHtmlButtonResponse,
        stimulus: start_prompt2,
        choices: ['Start'],
        is_narrow: true,
        on_finish: function() { jsPsych.setProgressBar(0.22); },
    };

    var num_trials = trial_info.length;
    // precompute trial order (rather than letting jsPsych randomize) so it can be displayed per trial
    var trial_order = generate_trial_order(num_trials);

    var trials = {
        timeline_variables: trial_info,
        timeline: [
            {
                type: jsPsychInstructions,
                pages: jsPsych.timelineVariable('pages'),
                header: function() {
                    var html = '<h2> Scenario ' + (trial_order.indexOf(jsPsych
                        .timelineVariable('trial', true) - 1) + 1) + 
                        ' of ' + num_trials + '</h2>';
                    return html;
                },
                show_clickable_nav: true,
                button_label_previous: '',
                button_label_next: ''
            },
            {
                type: judgeResponsibility,
                trial: jsPsych.timelineVariable('trial'),
                title: function() {
                    var html = '<h2> Scenario ' + (trial_order.indexOf(jsPsych
                        .timelineVariable('trial', true) - 1) + 1) +
                        ' of ' + num_trials + '</h2>';
                    return html;
                },
                outcome: jsPsych.timelineVariable('outcome')
            },
        ],
        choices: ['Continue'],
        sample: {
            type: 'custom',
            fn: function(t) {
                return trial_order;
            },
        },
        on_finish: function() {
            var prog = jsPsych.getProgressBarCompleted();
            jsPsych.setProgressBar(prog + 0.015);
        }
    };
    

    // -----------------------------------------------------
    // save data
    // -----------------------------------------------------
    const prolific_id = jsPsych.data.getURLVariable('PROLIFIC_PID');

    const save_trial_data = {
        type: jsPsychPipe,
        action: "save",
        experiment_id: "vYPnmgqytVFR",
        filename: `${prolific_id}_trials.csv`,
        data_string: () => {
            const data = jsPsych.data.get().filter({trial_type: 'judge-responsibility'}).values();
            const trials = data.flatMap((t) => {
                return [prolific_id, t.trial, t.response].join(",");
            });
            const header = "id,trial,response";
            const trials_csv = [header, ...trials].join("\n");
            return trials_csv;
        }
    };

    const save_participant_data = {
        type: jsPsychPipe,
        action: "save",
        experiment_id: "vYPnmgqytVFR",
        filename: `${prolific_id}_participant.csv`,
        data_string: () => {
            const time = TimeMe.getTimeOnPageInSeconds('page');
            const data = jsPsych.data.get().filter({trial_type: 'survey-html-form'}).values()[0]['response'];
            const participant = [
                prolific_id,
                `"${data.feedback || ""}"`,
                data.age || "",
                data.gender || "",
                data.race || "",
                `"${data.ethnicity || ""}"`,
                time
            ].join(",");
            const header = "id,feedback,age,gender,race,ethnicity,time";
            const participant_csv = header + "\n" + participant;
            return participant_csv;
        }
    };

    // -----------------------------------------------------
    // compile timeline
    // -----------------------------------------------------
    let timeline = [];
    timeline.push(preload_trial);
    timeline.push(loop_node);
    timeline.push(trials_start1);
    timeline.push(trials_start2);
    timeline.push(trials);
    timeline.push(feedback_demographics);
    timeline.push(save_trial_data);
    timeline.push(save_participant_data);


    // -----------------------------------------------------
    // run timeline
    // -----------------------------------------------------
    jsPsych.run(timeline);


</script>

</html>
