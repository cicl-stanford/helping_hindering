<!DOCTYPE html>
<html>
    <head>
        <title> Psychology Experiment </title>
        
        <link rel="stylesheet" href='css/jspsych.css' />
        <link rel="stylesheet" href='css/jquery-ui-edit.css' />
        <link rel="stylesheet" href='css/jquery-ui-slider-pips-edit.css' />
       
        <script src='js/jquery.min.js'></script>
        <script src='js/jquery-ui.min.js'></script>
        <script src='js/jquery-ui-slider-pips.js'></script>
        <script src='https://proliferate.alps.science/static/js/proliferate.js'></script>

        <script src='js/jspsych.js'></script>
        <script src='js/jspsych-instructions.js'></script>
        <script src='js/jspsych-button.js'></script>
        <script src='js/jspsych-multi-choice.js'></script>
        <script src='js/jspsych-form.js'></script>

        <script src='js/instructions-t2.js'></script>
        <script src="js/judge-resp-intention.js"></script>
        <script src="js/infer-intention.js"></script>
        <script src="js/judge-next.js"></script>
        <script src="js/free-response.js"></script>
        <script src='js/feedback-demographics.js'></script>
        <script src='js/trial_info.js'></script>
        <script src='js/utils.js'></script>
        <script src='instructions/text.js'></script>
    </head>

    </body></body>

    <script>
        // -----------------------------------------------------
        // instructions and comprehension check
        // -----------------------------------------------------
        // if comprehension questions are answered incorrectly, loop back to the start of instructions

        var instructions = {
            type: 'instructions',
            pages: instruction_pages,
            show_clickable_nav: true,
            on_start: function() { jsPsych.setProgressBar(0.02); },
            on_finish: function() { jsPsych.setProgressBar(0.10); }
        };

        var instructions_trial = {
            type: 'judge-resp-intention',
            trial: 0,
            title: '<h3 style="margin-bottom: -10px;"> Example Round </h3>',
            footer: function() {
                var html = '<p> Player A: ' +
                    red(ex_red_name) + ', Player B: ' +
                    blue(ex_blue_name) + '</p>';
                return html;
            },
            red_name: ex_red_name,
            blue_name: ex_blue_name,
            outcome: ex_outcome,
            on_finish: function() { jsPsych.setProgressBar(0.12); }
        }

        var instructions_last = {
            type: 'html-button-response',
            stimulus: instructions_last,
            choices: ['Continue'],
            is_narrow: true,
            on_finish: function() { jsPsych.setProgressBar(0.14); }
        }
 
        var comprehension_qs = {
            type: 'survey-multi-choice',
            questions: [
                {
                    stimulus: comprehension1,
                    options: options1,
                    horizontal: true
                },
                {
                    stimulus: comprehension2,
                    options: options2,
                    horizontal: true
                },
                {
                    stimulus: comprehension3,
                    options: options3,
                    horizontal: true
                },
                {
                    stimulus: comprehension4,
                    options: options4,
                    horizontal: true
                },
                {
                    stimulus: comprehension5,
                    options: options5,
                    horizontal: true
                }
            ],
            preamble: 'Please answer a few comprehension questions so we know' +
                ' that you understand the setup.',
            on_finish: function(data){
                // jspsych records responses as json strings
                data.correct = (data.responses == '{"Q0":"False","Q1":"3 only","Q2":"True","Q3":"2 only","Q4":"True"}');
            }
        }
        
        var fail_comprehension = {
            timeline: [{
                type: 'html-button-response',
                stimulus: 'Unfortunately, you missed some of the comprehension ' +
                    'questions.</p> <p> Please review the instructions again.',
                choices: ['Review'],
            }],
            conditional_function: function(){
                var data = jsPsych.data.get().last(1).values()[0];
                return !(data.correct);
            }
        }

        var loop_node = {
            timeline: [
                instructions,
                instructions_trial,
                instructions_last,
                comprehension_qs,
                fail_comprehension
            ],
            loop_function: function(data){
                var data = jsPsych.data.get().last(1).values()[0];
                return !(data.correct);
            }
        }
        

        // -----------------------------------------------------
        // experiment trials
        // -----------------------------------------------------

        // add transition to start
        var trials_start1 = {
            type: 'html-button-response',
            stimulus: start_prompt1,
            choices: ['Continue'],
            is_narrow: true,
            on_finish: function() { jsPsych.setProgressBar(0.16); },
        };
        
        var trials_start2 = {
            type: 'html-button-response',
            stimulus: start_prompt2,
            choices: ['Start'],
            is_narrow: true,
            on_finish: function() { jsPsych.setProgressBar(0.18); },
        };

        var num_trials = trial_info.length;

        // precompute trial order instead of letting jsPsych randomize it live, so it can be displayed per trial
        var trial_order = generate_trial_order(num_trials);

        var judge_t1;

        var trials = {
            timeline_variables: trial_info,
            timeline: [
                {
                    type: 'html-button-response',
                    stimulus: function() {
                        var players = '<p> Player A is <b><span style="color:rgb' + (jsPsych.timelineVariable('red_display', true)) + ';">' + (jsPsych.timelineVariable('red_name', true)) + '</span></b>' +
                            '. </p> <p> Player B is <b><span style="color:rgb' + (jsPsych.timelineVariable('blue_display', true)) + ';">' + (jsPsych.timelineVariable('blue_name', true)) + '</span></b>.</p>';
                        var html = '<h3> Trial ' + (trial_order.indexOf(jsPsych
                            .timelineVariable('trial', true) - 1) + 1) + '</h3>' +
                            players +
                            '<p style="margin-bottom: -10px;"> Click Continue to see what happens in Round 1. </p>';
                        return html;
                    },
                    choices: ['Continue'],
                    is_narrow: true
                },
                {
                    type: 'instructions',
                    pages: jsPsych.timelineVariable('pages_t1'),
                    header: function() {
                        var html = '<h3> Trial ' + (trial_order.indexOf(jsPsych
                            .timelineVariable('trial', true) - 1) + 1) + '</h3>';
                        return html;
                    },
                    footer: function() {
                        var html = '<p> Player A: <b><span style="color:rgb' + (jsPsych.timelineVariable('red_display', true)) + ';">' + (jsPsych.timelineVariable('red_name', true)) + '</span></b>' +
                            ', Player B: <b><span style="color:rgb' + (jsPsych.timelineVariable('blue_display', true)) + ';">' + (jsPsych.timelineVariable('blue_name', true)) + '</span></b></p>'
                        return html;
                    },
                    show_clickable_nav: true,
                    button_label_previous: '',
                    button_label_next: ''
                },
                {
                    type: 'judge-next',
                    trial: jsPsych.timelineVariable('trial'),
                    title: function() {
                        var html = '<h3> Trial ' + (trial_order.indexOf(jsPsych
                            .timelineVariable('trial', true) - 1) + 1) + '</h3>';
                        return html;
                    },
                    footer: function() {
                        var html = '<p> Player A: <b><span style="color:rgb' + (jsPsych.timelineVariable('red_display', true)) + ';">' + (jsPsych.timelineVariable('red_name', true)) + '</span></b>' +
                            ', Player B: <b><span style="color:rgb' + (jsPsych.timelineVariable('blue_display', true)) + ';">' + (jsPsych.timelineVariable('blue_name', true)) + '</span></b></p>'
                        return html;
                    },
                    red_name: jsPsych.timelineVariable('red_name'),
                    blue_name: jsPsych.timelineVariable('blue_name'),
                    red_display: jsPsych.timelineVariable('red_display'),
                    blue_display: jsPsych.timelineVariable('blue_display'),
                    on_finish: function(data) { judge_t1 = data["judge_t1"]; },
                },
                {
                    type: 'instructions-t2',
                    trial: jsPsych.timelineVariable('trial'),
                    pages: jsPsych.timelineVariable('pages_t2'),
                    header: function() {
                        var html = '<h3> Trial ' + (trial_order.indexOf(jsPsych
                            .timelineVariable('trial', true) - 1) + 1) + '</h3>';
                        return html;
                    },
                    footer: function() {
                        var html = '<p> Player A: <b><span style="color:rgb' + (jsPsych.timelineVariable('red_display', true)) + ';">' + (jsPsych.timelineVariable('red_name', true)) + '</span></b>' +
                            ', Player B: <b><span style="color:rgb' + (jsPsych.timelineVariable('blue_display', true)) + ';">' + (jsPsych.timelineVariable('blue_name', true)) + '</span></b></p>'
                        return html;
                    },
                    red_name: jsPsych.timelineVariable('red_name'),
                    blue_name: jsPsych.timelineVariable('blue_name'),
                    red_display: jsPsych.timelineVariable('red_display'),
                    blue_display: jsPsych.timelineVariable('blue_display'),
                    judgment_t1: function() { return judge_t1; },
                    show_clickable_nav: true,
                    button_label_previous: '',
                    button_label_next: ''
                },
                {
                    type: 'judge-resp-intention',
                    trial: jsPsych.timelineVariable('trial'),
                    title: function() {
                        var html = '<h3> Trial ' + (trial_order.indexOf(jsPsych
                            .timelineVariable('trial', true) - 1) + 1) + '</h3>';
                        return html;
                    },
                    footer: function() {
                        var html = '<p> Player A: <b><span style="color:rgb' + (jsPsych.timelineVariable('red_display', true)) + ';">' + (jsPsych.timelineVariable('red_name', true)) + '</span></b>' +
                            ', Player B: <b><span style="color:rgb' + (jsPsych.timelineVariable('blue_display', true)) + ';">' + (jsPsych.timelineVariable('blue_name', true)) + '</span></b></p>'
                        return html;
                    },
                    red_name: jsPsych.timelineVariable('red_name'),
                    blue_name: jsPsych.timelineVariable('blue_name'),
                    red_display: jsPsych.timelineVariable('red_display'),
                    blue_display: jsPsych.timelineVariable('blue_display'),
                    outcome: jsPsych.timelineVariable('outcome_t2'),
                    judgment_t1: function() { return judge_t1; },
                }
            ],

            choices: ['Continue'],
            sample: {
                type: 'custom',
                fn: function(t) {
                    return trial_order;
                },
            },
            on_finish: function() {
                var prog = jsPsych.getProgressBarCompleted();
                jsPsych.setProgressBar(prog + 0.02);
            }
        };

        // -----------------------------------------------------
        // feedback and demographic info
        // -----------------------------------------------------
        // note: Prolific collects: country of birth, current country of
        //       residence, employment status, first language, nationality,
        //       sex, and student status
        // form in js/feedback-demographics.js

        
        // -----------------------------------------------------
        // compile everything
        // -----------------------------------------------------

        timeline = [];
        timeline.push(loop_node);
        timeline.push(trials_start1);
        timeline.push(trials_start2);
        timeline.push(trials);
        timeline.push(feedback_demographics);

        jsPsych.init({
            timeline: timeline,
            preload_images: instruction_images.concat(trial_images),
            show_progress_bar: true,
            auto_update_progress_bar: false,
            on_finish: function() {
                var data = jsPsych.data.get();
                var data_t1 = data.filter({trial_type: 'judge-next'}).values();
                var data_t2 = data.filter({trial_type: 'judge-resp-intention'}).values();
                var values_feedback = data.filter({trial_type: 'survey-html-form'}).values();

                var trials = [];
                for (var i = 0; i < num_trials; i++) {
                    trials.push({
                        "trial": parseInt(data_t1[i]["trial"]),
                        "judge_t1": parseInt(data_t1[i]["judge_t1"]),
                        "int_t2": parseInt(data_t2[i + 1]["int_t2"]),
                        "resp_red": parseInt(data_t2[i + 1]["resp_red"]),
                        "resp_blue": parseInt(data_t2[i + 1]["resp_blue"])
                    });
                }

                var participant = JSON.parse(values_feedback[0]['responses']);
                // override if selected "other" or none
                if (participant.gender == "other_gender" || typeof participant.gender == "undefined") {
                    participant.gender = participant.other_gender;
                }
                delete participant.other_gender;
                if (participant.race == "other_race" || typeof participant.race == "undefined") {
                    participant.race = participant.other_race;
                }
                delete participant.other_race;
                if (typeof participant.ethnicity == "undefined") {
                    participant.ethnicity = "";
                }
                participant.age = parseInt(participant.age);
                participant.time = parseInt(values_feedback[0]['time_elapsed']);

                proliferate.submit({
                    "trials": trials,
                    "participants": [participant],
                });

                $('#jspsych-content').css('margin-top', 'auto');
                $('#jspsych-content').html('<div style="margin: auto;"> <p>' +
                    ' Thank you for participating in this experiment! </p>' +
                    '<p> Redirecting you back to Prolific... </p>');
                setTimeout(function(){}, 200);
            }
        });
    </script>

</html>
